name: Build iOS IPA + Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS release app
        run: flutter build ios --release --no-codesign

      - name: Package into IPA (Payload format)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y MyIMES-${{ github.ref_name }}.ipa Payload
          mkdir -p artifacts
          mv MyIMES-${{ github.ref_name }}.ipa artifacts/

      - name: Upload IPA artifact (for Actions download)
        uses: actions/upload-artifact@v4
        with:
          name: MyIMES-IPA-${{ github.ref_name }}
          path: artifacts/*.ipa

      - name: Upload IPA to GitHub Release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "Uploading IPA to release $TAG..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.ipa --clobber
            echo "Successfully attached IPA to release $TAG"
          else
            echo "Release $TAG not found yet. Creating release $TAG with IPA..."
            gh release create "$TAG" artifacts/*.ipa \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi

